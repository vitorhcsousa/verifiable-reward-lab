[project]
name = "rlvr-from-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "vitorhcsousa", email = "vitorsousavhcs@outlook.com" }
]
requires-python = ">=3.13"
dependencies = [
    "datasets>=4.8.4",
    "ipykernel>=7.2.0",
    "lightning>=2.6.1",
    "matplotlib>=3.10.8",
    "numpy>=2.4.4",
    "pyyaml>=6.0.3",
    "sentencepiece>=0.2.1",
    "torch>=2.11.0",
    "tqdm>=4.67.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

tracking = [
    "wandb>=0.25.1",
]

[tool.uv]
dev-dependencies = [
    "lovely-tensors>=0.1.22",
    "marimo>=0.22.0",
    "plotly>=6.6.0",
    "torchinfo>=1.8.0",
    "pre-commit>=4.5.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.8",
    "ty>=0.0.27",
]
